[project]
name = "provider-directory"
version = "0.1.0"
description = "Arizona provider-directory mart and HTTP API"
requires-python = ">=3.10"
dependencies = [
    "pymysql>=1.1.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.27.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4.0", "httpx>=0.27.0"]

[project.scripts]
pd = "provider_directory.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["provider_directory*"]
